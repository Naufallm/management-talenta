# Cloudflare HTTPS may reach this host through its HTTP tunnel.
server {
    listen 80;
    server_name talenta.bpskotabatu.com;
    client_max_body_size 3m;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    if ($http_x_forwarded_proto != "https") {
        return 308 https://talenta.bpskotabatu.com$request_uri;
    }
    location / {
        proxy_pass http://127.0.0.1:5015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl http2;
    server_name talenta.bpskotabatu.com;
    ssl_certificate /etc/ssl/certs/talenta.crt;
    ssl_certificate_key /etc/ssl/private/talenta.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 3m;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    location / {
        proxy_pass http://127.0.0.1:5015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
